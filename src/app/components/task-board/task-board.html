<section>
    <form>
        <input type="text" placeholder="Filter by taskId" #filter />
        <button class="primary" type="button" (click)="filterResults(filter.value)">Search</button>
    </form>
</section>
<section class="results">
    @for (task of taskList; track $index) {
        <app-task [task]="task" />
    }
</section>
